onboarding = false
[ui]
agent_panel_sort = "priority"

# spaces パネルの表示行。branch/git_status の2行目を消し、アイコン＋タイトルのみ表示する
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

# agents パネルの表示行。1行目にアイコン＋タブ名、2行目に spaces 名を表示する
# 体裁を入れ替え、tab を強調（bold）、workspace を薄く（dim）表示する
[ui.sidebar.agents]
rows = [["state_icon", { token = "tab", bold = true, dim = false, fg = "#ffffff" }], [{ token = "workspace", bold = false, dim = true }]]

[keys]
previous_tab = "shift+cmd+left"
next_tab = "shift+cmd+right"
# agents パネルのセッション間フォーカス移動（上=前、下=次）
previous_agent = "shift+cmd+up"
next_agent = "shift+cmd+down"
