name: Pinact update

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinact-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update pinned actions
        run: nix run --inputs-from . nixpkgs#pinact -- run --update --min-age 7
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify pinned actions
        run: nix run --inputs-from . nixpkgs#pinact -- run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report manual pinact update
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/workflows; then
            echo "GitHub Actions are already up to date."
            exit 0
          fi

          cat <<'BODY' | tee "$GITHUB_STEP_SUMMARY"
          ## Manual pinact update required

          pinact found updates under `.github/workflows`. GitHub Actions' default
          token cannot push workflow file changes, so create the update PR from a
          local checkout instead of storing a workflow-update token in repository
          secrets.

          ```sh
          scripts/create-pinact-update-pr
          ```
          BODY

          git diff -- .github/workflows
          echo "::warning::Pinned GitHub Actions updates are available. Run scripts/create-pinact-update-pr from a local checkout."
