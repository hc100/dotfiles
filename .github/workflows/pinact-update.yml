name: Pinact update

on:
  schedule:
    - cron: "0 19 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinact-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update pinned actions
        run: nix run --inputs-from . nixpkgs#pinact -- run --update --min-age 7
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify pinned actions
        run: nix run --inputs-from . nixpkgs#pinact -- run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report manual pinact update
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/workflows; then
            echo "GitHub Actions are already up to date."
            exit 0
          fi

          cat <<'BODY' | tee "$GITHUB_STEP_SUMMARY"
          ## Manual pinact update required

          pinact found updates under `.github/workflows`. GitHub Actions' default
          token cannot push workflow file changes, so create the update PR from a
          local checkout instead of storing a workflow-update token in repository
          secrets.

          ```sh
          git switch main
          git pull --ff-only
          git switch -c codex/pinact-update
          nix run --inputs-from . nixpkgs#pinact -- run --update --min-age 7
          nix run --inputs-from . nixpkgs#pinact -- run --check
          git add .github/workflows
          git commit -m "Update pinned GitHub Actions"
          git push -u origin codex/pinact-update
          gh pr create --base main --head codex/pinact-update --title "Update pinned GitHub Actions"
          ```
          BODY

          git diff -- .github/workflows
          exit 1
